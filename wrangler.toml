name = "prchsalerts"
main = "worker/index.js"
compatibility_date = "2025-06-07"

[vars]
PUBLIC_ORIGIN = "https://prchsalerts.kikinttrex0231.workers.dev"

[assets]
directory = "frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[secrets]
required = ["SESSION_SECRET", "PASSWORD_PEPPER"]

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

[[d1_databases]]
binding = "DB"
database_name = "another-game-more"
database_id = "12fff928-a2c4-4b29-83ae-021b9621dac1"
migrations_dir = "worker/database/migrations"

[[kv_namespaces]]
binding = "WEEKLY_STATS"
id = "420ea278f9c0497dbf84832983d4881b"

[triggers]
crons = ["0 6 * * 1"]

[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "80240911301"

  [ratelimits.simple]
  limit = 20
  period = 60

[[ratelimits]]
name = "ADMIN_RATE_LIMITER"
namespace_id = "80240911302"

  [ratelimits.simple]
  limit = 300
  period = 60

[[ratelimits]]
name = "WEBHOOK_RATE_LIMITER"
namespace_id = "80240911303"

  [ratelimits.simple]
  limit = 1200
  period = 60
